[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "p37-neuro-ml"
version = "0.2.0"
description = "Trainable hierarchical robot brain for P37 Neuro."
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "p37-neuro",
  "PyYAML>=6.0",
  "torch>=2.8,<3",
]

[project.optional-dependencies]
export = [
  "onnx>=1.17",
  "onnxscript>=0.2",
]

[project.scripts]
p37-neuro-ml = "p37_neuro_ml.cli:main"

[tool.uv.sources]
p37-neuro = { path = "..", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/p37_neuro_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
