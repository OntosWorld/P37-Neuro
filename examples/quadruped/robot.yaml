schema_version: 1
robot_id: reference-quadruped
family: quadruped
description:
  format: urdf
  path: robot.urdf
runtime:
  transport: ros2
  control_frequency_hz: 200
  state_topic: /quadruped/joint_states
  command_topic: /quadruped/p37_commands
  stop_topic: /quadruped/p37_stop
safety:
  max_observation_age_s: 0.1
  require_external_estop: true
  require_controller_watchdog: true
sensors:
  joint_state: /quadruped/joint_states
  base_imu: /quadruped/imu
  front_rgb: /quadruped/front/image
metadata:
  example: "true"
  qualification: reference-integration-only
