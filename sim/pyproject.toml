[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "p37-neuro-sim"
version = "0.1.0"
description = "MuJoCo simulation adapter for P37 Neuro."
requires-python = ">=3.12,<3.14"
dependencies = [
  "p37-neuro",
  "mujoco>=3.13,<4",
  "numpy>=2,<3",
]

[tool.uv.sources]
p37-neuro = { path = "..", editable = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/p37_neuro_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
