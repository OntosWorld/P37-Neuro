name: Bug report
description: Report a reproducible defect in P37 Neuro.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include configuration, embodiment and commit SHA.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: State whether this can affect physical execution or data integrity.
    validations:
      required: true
