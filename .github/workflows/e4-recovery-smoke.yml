name: E4 Recovery Smoke

on:
  push:
    branches: [main]
    paths:
      - "ml/src/p37_neuro_ml/e4_recovery_smoke.py"
      - "ml/tests/test_e4_recovery_smoke.py"
      - "ml/src/p37_neuro_ml/model.py"
      - ".github/workflows/e4-recovery-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          version: "latest-known"
          enable-cache: true
      - run: uv sync --all-groups
      - name: Train long-horizon recovery memory
        run: uv run python -m p37_neuro_ml.e4_recovery_smoke --epochs 200 --output artifacts/e4-recovery-smoke
      - name: Show metrics
        run: cat artifacts/e4-recovery-smoke/metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: p37-e4-recovery-smoke
          path: |
            ml/artifacts/e4-recovery-smoke/metrics.json
            ml/artifacts/e4-recovery-smoke/checkpoint/manifest.json
          if-no-files-found: error
