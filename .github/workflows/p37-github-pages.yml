name: P37 Neuro — Single Site
on:
  pull_request:
    paths:
      - "sim/web/assemble_site.py"
      - "sim/web/render_task_posters.py"
      - "sim/web/build_mjswan.py"
      - "sim/web/panda_physical_stack.py"
      - "sim/web/physical_task_scenes.py"
      - "sim/web/steering_bridge.js"
      - "sim/web/model_motion_library.py"
      - "sim/web/catalog.py"
      - "sim/web/p37_browser_policy.py"
      - "sim/web/root_e2e_test.py"
      - "docs/interactive-lab/steel/**"
      - ".github/workflows/p37-github-pages.yml"
  push:
    branches: [main]
    paths:
      - "sim/web/assemble_site.py"
      - "sim/web/render_task_posters.py"
      - "sim/web/build_mjswan.py"
      - "sim/web/panda_physical_stack.py"
      - "sim/web/physical_task_scenes.py"
      - "sim/web/steering_bridge.js"
      - "sim/web/model_motion_library.py"
      - "sim/web/catalog.py"
      - "sim/web/p37_browser_policy.py"
      - "sim/web/root_e2e_test.py"
      - "docs/interactive-lab/steel/**"
      - ".github/workflows/p37-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p37-neuro-github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate one live root page
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Obtain reviewed P37 G1 experimental model
        uses: actions/download-artifact@v4
        with:
          name: p37-g1-experimental-not-qualified
          run-id: 42896162520
          github-token: ${{ github.token }}
          path: _p37_policy
      - name: Build manufacturer-derived robots and P37 browser controller
        run: |
          node --check sim/web/steering_bridge.js
          python -m pip install "mjswan[examples]" "mujoco"
          git clone --depth 1 https://github.com/google-deepmind/mujoco_menagerie.git _menagerie
          python sim/web/build_mjswan.py \
            --menagerie _menagerie \
            --base-path /P37-Neuro/simulator/ \
            --p37-artifact _p37_policy
      - name: Render native physical robot task gallery posters
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libosmesa6-dev
          python -m pip install Pillow PyOpenGL
          python sim/web/render_task_posters.py \
            --menagerie _menagerie \
            --output docs/interactive-lab/steel/public/task-posters
      - name: Build Steel WebGPU task gallery
        working-directory: docs/interactive-lab/steel
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Publish only the canonical root experience
        run: python sim/web/assemble_site.py --output _pages
      - name: Validate root page and isolated browser assets
        run: |
          python -m pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium
          python sim/web/root_e2e_test.py --site _pages --url-prefix /P37-Neuro/ --screenshots _pages_test_results
      - name: Keep root browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p37-single-root-browser-evidence
          path: _pages_test_results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload site preview
        uses: actions/upload-artifact@v4
        with:
          name: p37-single-root-site
          path: _pages/
          if-no-files-found: error
          retention-days: 14
      - name: Package for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages/

  deploy:
    name: Publish canonical P37-Neuro URL
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Confirm deployment location
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          echo "P37-Neuro published at $PAGE_URL"
