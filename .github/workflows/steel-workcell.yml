name: P37 Real-Robot Frontend
on:
  pull_request:
    paths:
      - "docs/interactive-lab/steel/**"
      - "src/p37_neuro/data/mimicgen_import.py"
      - "scripts/mimicgen_to_p37.py"
      - "tests/test_mimicgen_import.py"
      - ".github/workflows/steel-workcell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs/interactive-lab/steel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser UI dependencies
        run: npm install --no-audit --no-fund
      - name: Compile real-robot homepage
        run: npm run build
      - name: Reject obsolete procedural public stage
        run: |
          ! grep -q 'import.*Workcell' src/App.tsx
          ! grep -q 'Steel.*WebGPU' src/App.tsx
          grep -q 'real-robot-frame' src/App.tsx
          grep -q 'Run P37 experimental' src/App.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: p37-native-robot-frontend-preview
          path: docs/interactive-lab/steel/dist
          retention-days: 14

  dataset-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Validate real MimicGen ingestion
        run: uv run --with h5py pytest -q tests/test_mimicgen_import.py
