name: Steel WebGPU workcell

on:
  pull_request:
    paths:
      - "docs/interactive-lab/steel/**"
      - "src/p37_neuro/data/mimicgen_import.py"
      - "scripts/mimicgen_to_p37.py"
      - "tests/test_mimicgen_import.py"
      - ".github/workflows/steel-workcell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs/interactive-lab/steel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Steel and viewer dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and compile production viewer
        run: npm run build
      - name: Install Chromium for real GPU canvas QA
        run: npx playwright install --with-deps chromium
      - name: Compare desktop/mobile against Steel reference (software GPU)
        env:
          P37_REQUIRE_GPU: "0"
        run: node scripts/reference-visual-qa.mjs
      - name: Archive desktop/mobile screenshots, adapter telemetry and reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p37-skild-visual-and-webgpu-review
          path: docs/interactive-lab/steel/visual-evidence/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: p37-steel-workcell-static-preview
          path: docs/interactive-lab/steel/dist
          retention-days: 14

  metal-gpu:
    name: macOS Metal WebGPU visual gate
    runs-on: macos-15
    timeout-minutes: 22
    defaults:
      run:
        working-directory: docs/interactive-lab/steel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Steel and visual QA dependencies
        run: npm install --no-audit --no-fund
      - name: Build viewer
        run: npm run build
      - name: Install Chromium on Apple Silicon
        run: npx playwright install chromium
      - name: Capture reference and prove Steel GPU physics on macOS
        env:
          P37_REQUIRE_GPU: "1"
        run: node scripts/reference-visual-qa.mjs
      - name: Keep Metal GPU and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p37-macos-metal-gpu-proof
          path: docs/interactive-lab/steel/visual-evidence/
          retention-days: 14
          if-no-files-found: warn

  dataset-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Validate MimicGen HDF5 ingestion using a local deterministic fixture
        run: uv run --with h5py pytest -q tests/test_mimicgen_import.py
