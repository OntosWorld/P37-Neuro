name: Steel WebGPU workcell

on:
  pull_request:
    paths:
      - "docs/interactive-lab/steel/**"
      - "src/p37_neuro/data/mimicgen_import.py"
      - "scripts/mimicgen_to_p37.py"
      - "tests/test_mimicgen_import.py"
      - ".github/workflows/steel-workcell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs/interactive-lab/steel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Steel and viewer dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and compile production viewer
        run: npm run build
      - name: Install browser for actual WebGPU rendering
        run: npx playwright install --with-deps chrome
      - name: Capture Skild Steel playground reference
        run: node scripts/skild-reference.mjs
      - name: Save Skild Steel benchmark screenshots and computed styles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skild-steel-reference
          path: docs/interactive-lab/steel/skild-reference/
          retention-days: 7
          if-no-files-found: warn
      - name: Inspect physics startup, environment switching, recorded source and mobile layout
        run: node scripts/visual-smoke.mjs
      - name: Keep full-resolution browser screenshots and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p37-steel-visual-review
          path: docs/interactive-lab/steel/visual-evidence/
          retention-days: 21
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: p37-steel-workcell-static-preview
          path: docs/interactive-lab/steel/dist
          retention-days: 14

  dataset-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Validate MimicGen HDF5 ingestion using a local deterministic fixture
        run: uv run --with h5py pytest -q tests/test_mimicgen_import.py
