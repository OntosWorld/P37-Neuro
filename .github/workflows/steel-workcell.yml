name: Steel WebGPU workcell

on:
  pull_request:
    paths:
      - "docs/interactive-lab/steel/**"
      - "sim/web/**"
      - ".github/workflows/steel-workcell.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frontend:
    name: Native robot showcase frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs/interactive-lab/steel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned browser dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and compile manufacturer-only public viewer
        run: npm run build
      - name: Assert no procedural reference arms remain in public interface
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const source = fs.readFileSync('src/App.tsx', 'utf8');
            if (source.includes('Compact arm') || source.includes('Extended arm') ||
                source.includes('LiveScene') || !source.includes('menagerie-viewer') ||
                !source.includes('unitree_g1')) process.exit(1);
          "
      - uses: actions/upload-artifact@v4
        with:
          name: p37-real-robot-frontend-preview
          path: docs/interactive-lab/steel/dist
          retention-days: 14

  metal-gpu:
    name: macOS real robot and recurrent policy browser gate
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install native MuJoCo and browser test dependencies
        run: |
          python -m pip install "mjswan[examples]" "mujoco" "playwright>=1.55,<2"
          python -m playwright install chromium
      - name: Download pinned experimental recurrent P37 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: p37-g1-experimental-not-qualified
          run-id: 42896162520
          github-token: ${{ github.token }}
          path: _p37_policy
      - name: Fetch manufacturer robot models
        run: git clone --depth 1 https://github.com/google-deepmind/mujoco_menagerie.git _menagerie
      - name: Compile real robots and verified recurrent G1 policy
        run: |
          python sim/web/build_mjswan.py \
            --menagerie _menagerie \
            --base-path /P37-Neuro/simulator/ \
            --p37-artifact _p37_policy
      - name: Build public robot UI
        working-directory: docs/interactive-lab/steel
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify native browser physics, selected robots, real meshes and policy
        run: |
          python sim/web/assemble_site.py --output _pages
          python sim/web/root_e2e_test.py \
            --site _pages \
            --url-prefix /P37-Neuro/ \
            --screenshots _robot_visual_evidence \
            --skip-gallery-previews
      - name: Keep robot screenshots and policy-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p37-macos-native-robot-and-policy-proof
          path: _robot_visual_evidence/
          retention-days: 14
          if-no-files-found: warn

  dataset-adapter:
    name: MimicGen dataset adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Validate MimicGen ingestion using reproducible fixture
        run: uv run --with h5py pytest -q tests/test_mimicgen_import.py
