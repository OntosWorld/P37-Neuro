name: Format G1 experiment files once
on:
  push:
    branches: [feat/browser-brain-lab-foundation]
    paths:
      - ".github/workflows/format-g1-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'OntosRobotics/P37-Neuro'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/browser-brain-lab-foundation
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - name: Run Ruff formatter on changed Python sources
        run: |
          uvx ruff format \
            sim/src/p37_neuro_sim/g1_rollout.py \
            sim/src/p37_neuro_sim/g1_locomotion_env.py \
            sim/src/p37_neuro_sim/g1_train.py \
            sim/src/p37_neuro_sim/g1_p37_train.py \
            sim/tests/test_g1_rollout.py \
            sim/tests/test_g1_locomotion_env.py \
            src/p37_neuro/integration/mapping.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sim/src/p37_neuro_sim/g1_rollout.py \
            sim/src/p37_neuro_sim/g1_locomotion_env.py \
            sim/src/p37_neuro_sim/g1_train.py \
            sim/src/p37_neuro_sim/g1_p37_train.py \
            sim/tests/test_g1_rollout.py \
            sim/tests/test_g1_locomotion_env.py \
            src/p37_neuro/integration/mapping.py
          if ! git diff --staged --quiet; then
            git commit -m "style(sim): format G1 experiment source files"
            git push origin HEAD:feat/browser-brain-lab-foundation
          fi
