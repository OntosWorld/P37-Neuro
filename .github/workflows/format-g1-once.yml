name: One-time G1 format
on:
  push:
    branches:
      - feat/browser-brain-lab-foundation
    paths:
      - .github/workflows/format-g1-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/browser-brain-lab-foundation
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - name: Format Python and self-remove this workflow
        run: |
          uvx ruff format sim/src/p37_neuro_sim/g1_rollout.py sim/src/p37_neuro_sim/g1_locomotion_env.py sim/src/p37_neuro_sim/g1_train.py sim/src/p37_neuro_sim/g1_p37_train.py sim/tests/test_g1_rollout.py sim/tests/test_g1_locomotion_env.py src/p37_neuro/integration/mapping.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-g1-once.yml
          git add sim/src/p37_neuro_sim/g1_rollout.py sim/src/p37_neuro_sim/g1_locomotion_env.py sim/src/p37_neuro_sim/g1_train.py sim/src/p37_neuro_sim/g1_p37_train.py sim/tests/test_g1_rollout.py sim/tests/test_g1_locomotion_env.py src/p37_neuro/integration/mapping.py
          git commit -m "style(sim): normalize G1 experiment formatting"
          git push origin HEAD:feat/browser-brain-lab-foundation
