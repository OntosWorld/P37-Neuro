name: Browser Brain Lab
on:
  pull_request:
    paths:
      - "sim/web/**"
      - "docs/interactive-lab/**"
      - ".github/workflows/browser-brain-lab.yml"
  push:
    branches: [main]
    paths:
      - "sim/web/**"
      - ".github/workflows/browser-brain-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate MuJoCo catalog and native dynamics
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MuJoCo and test dependencies
        run: python -m pip install "mjswan" "pytest>=8.3"
      - name: Run catalog and evidence integrity tests
        run: |
          python -m compileall -q sim/web/build_mjswan.py sim/web/assemble_site.py
          python -m pytest -q sim/web/test_portal.py
      - name: Fetch manufacturer robot models
        run: git clone --depth 1 https://github.com/google-deepmind/mujoco_menagerie.git _menagerie
      - name: Measure real G1 and Go2 disturbance dynamics
        run: |
          python sim/web/disturbance_test.py \
            --menagerie _menagerie \
            --out _physics/g1-go2-force-results.json
      - name: Compile ten manufacturer-derived MuJoCo scenes
        run: |
          python sim/web/build_mjswan.py --menagerie _menagerie --base-path /P37-Neuro/simulator/
          python - <<'PY'
          import json
          from pathlib import Path
          from sim.web.catalog import ROBOTS
          manifest=json.loads(Path("sim/web/dist/manifest.json").read_text())
          scenes={s["id"] for p in manifest["projects"] for s in p["scenes"]}
          assert {r.id for r in ROBOTS} <= scenes
          assert len(scenes) >= 10
          print("Verified",len(scenes),"physical robot models")
          PY
      - name: Preserve force evidence
        uses: actions/upload-artifact@v4
        with:
          name: p37-physical-force-evidence
          path: _physics/g1-go2-force-results.json
          if-no-files-found: error
          retention-days: 14
