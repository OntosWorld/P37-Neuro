name: Browser Brain Lab

on:
  pull_request:
    paths:
      - "sim/web/**"
      - "docs/interactive-lab/**"
      - ".github/workflows/browser-brain-lab.yml"
  push:
    branches: [main]
    paths:
      - "sim/web/**"
      - ".github/workflows/browser-brain-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser simulation builder
        run: python -m pip install "mjswan" "pytest>=8.3"
      - name: Run static tests
        run: |
          python -m compileall -q sim/web/build_mjswan.py sim/web/assemble_site.py
          python -m pytest -q sim/web/test_portal.py
      - name: Fetch official virtual robot models
        run: git clone --depth 1 https://github.com/google-deepmind/mujoco_menagerie.git _menagerie
      - name: Verify measured external forces on G1 and Go2
        run: |
          python sim/web/disturbance_test.py \
            --menagerie _menagerie \
            --out _physics/g1-go2-force-results.json
      - name: Upload reproducible disturbance measurements
        uses: actions/upload-artifact@v4
        with:
          name: p37-physical-force-evidence
          path: _physics/g1-go2-force-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Build verifiable P37 public demo evidence
        run: |
          python sim/web/build_demo_evidence.py \
            --menagerie _menagerie \
            --forces _physics/g1-go2-force-results.json \
            --output _demo_evidence.json
          node --check sim/web/demos/demos.js
      - name: Build MuJoCo WebAssembly + ten robot scenes
        run: python sim/web/build_mjswan.py --menagerie _menagerie --base-path /simulator/
      - name: Setup Node for Steel WebGPU workcell
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build additive Steel WebGPU research workcell
        working-directory: docs/interactive-lab/steel
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Assemble and validate static website
        run: |
          python sim/web/assemble_site.py --output _site --demo-evidence _demo_evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("_site/simulator/manifest.json").read_text())
          scenes = {s["id"] for p in manifest["projects"] for s in p["scenes"]}
          assert {"unitree_g1", "unitree_go2", "franka_panda", "unitree_h1", "booster_t1", "boston_dynamics_spot", "crazyflie_2"} <= scenes
          assert len(scenes) >= 10
          assert Path("_site/index.html").is_file()
          assert Path("_site/simulator/index.html").is_file()
          assert Path("_site/catalog.json").is_file()
          assert Path("_site/studio.css").is_file()
          assert Path("_site/studio.js").is_file()
          assert Path("_site/demos/index.html").is_file()
          assert Path("_site/demos/evidence.json").is_file()
          assert Path("_site/lab/index.html").is_file()
          assert Path("_site/lab/sim/index.html").is_file()
          assert Path("_site/lab/compare/samples/mimicgen-square-source.json").is_file()
          assert Path("_site/lab/steel/index.html").is_file()
          assert Path("_site/lab/steel/samples/mimicgen-square-source.json").is_file()
          print("Built real robot scenes:", sorted(scenes))
          PY
      - name: Record provenance
        run: |
          python - <<'PY'
          import importlib.metadata
          import json
          import subprocess
          from pathlib import Path
          sha = subprocess.check_output(["git", "-C", "_menagerie", "rev-parse", "HEAD"], text=True).strip()
          info = {
              "model_origin": "google-deepmind/mujoco_menagerie",
              "menagerie_commit": sha,
              "mjswan": importlib.metadata.version("mjswan"),
              "mujoco": importlib.metadata.version("mujoco"),
              "policy": "none",
              "capability_evidence": False,
          }
          Path("_site/build-info.json").write_text(json.dumps(info, indent=2) + "\n")
          PY
      - name: Install Chromium browser test tools
        run: |
          python -m pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium
      - name: Run real browser scene, selection and reset test
        run: python sim/web/e2e_test.py --site _site --screenshots _screenshots --url-prefix /
      - name: Upload browser screenshots and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p37-browser-e2e-evidence
          path: _screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: p37-browser-brain-lab
          path: _site/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare GitHub Pages artifact on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.P37_ENABLE_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.P37_ENABLE_GITHUB_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Brain Lab
        id: deployment
        uses: actions/deploy-pages@v4
