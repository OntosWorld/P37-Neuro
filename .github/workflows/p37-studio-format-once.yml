name: One-time P37 studio code formatting
on:
  push:
    branches:
      - feat/brain-lab-studio-scenes
    paths:
      - .github/workflows/p37-studio-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.repository == 'OntosRobotics/P37-Neuro'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/brain-lab-studio-scenes
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - name: Format studio Python and remove temporary workflow
        run: |
          uvx ruff check --fix sim/web/assemble_site.py sim/web/build_mjswan.py sim/web/catalog.py sim/web/test_portal.py sim/web/e2e_test.py
          uvx ruff format sim/web/assemble_site.py sim/web/build_mjswan.py sim/web/catalog.py sim/web/test_portal.py sim/web/e2e_test.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p37-studio-format-once.yml
          git add sim/web/assemble_site.py sim/web/build_mjswan.py sim/web/catalog.py sim/web/test_portal.py sim/web/e2e_test.py
          git commit -m "style(web): apply repository Ruff format to Brain Lab"
          git push origin HEAD:feat/brain-lab-studio-scenes
